<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
        fill: #F9F9F9;
        stroke: #707070;
        stroke-width: 1;
        rx: 4;
        ry: 4;
        }
        .line {
        stroke: #707070;
        stroke-width: 1;
        }
        .text {
        font-family: Arial, sans-serif;
        font-size: 12px;
        fill: #000;
        }
        .title {
        font-weight: bold;
        font-size: 12px;
        }
        .content {
        font-size: 11px;
        fill: #333;
        }
        .small-box {
        fill: #FFFFFF;
        stroke: #707070;
        stroke-width: 1;
        rx: 2;
        ry: 2;
        }
    </style>

    <!-- ResponseOnlineOwnershipVerificationType -->
    <rect x="30" y="100" width="300" height="110" class="small-box"></rect>
    <text x="40" y="120" class="title">ResponseOnlineOwnershipVerificationType</text>
    <text x="40" y="140" class="content">- TypeCode</text>
    <text x="175" y="140" class="content">[1..1] TypeCodes</text>
    <text x="40" y="160" class="content">- Acknowledgement</text>
    <text x="175" y="160" class="content">[0..1] AcknowledgementType</text>
    <text x="40" y="180" class="content">- Rejection</text>
    <text x="175" y="180" class="content">[0..1] RejectionType</text>
    <text x="40" y="200" class="content">- Result</text>
    <text x="175" y="200" class="content">[0..1] ResultType</text>

    <!-- TypeCodes -->
    <rect x="380" y="5" width="80" height="30" class="small-box"></rect>
    <text x="390" y="25" class="title">TypeCodes</text>

    <!-- AcknowledgementType -->
    <rect x="380" y="50" width="250" height="90" class="small-box"></rect>
    <text x="390" y="70" class="title">AcknowledgementType</text>
    <text x="385" y="90" class="content">- UniqueID</text>
    <text x="555" y="90" class="content">[1..1] string</text>
    <text x="385" y="110" class="content">- ExpectedResponseDateTime</text>
    <text x="555" y="110" class="content">[1..1] dateTime</text>
    <text x="385" y="130" class="content">- MessageDescription</text>
    <text x="555" y="130" class="content">[1..1] string</text>

    <!-- RejectionType -->
    <rect x="380" y="150" width="250" height="130" class="small-box"></rect>
    <text x="390" y="170" class="title">RejectionType</text>
    <text x="385" y="190" class="content">- Reason</text>
    <text x="480" y="190" class="content">[1..1] string</text>
    <text x="385" y="210" class="content">- Code</text>
    <text x="480" y="210" class="content">[1..1] string</text>
    <text x="385" y="230" class="content">- OtherDescription</text>
    <text x="480" y="230" class="content">[0..1] string</text>
    <text x="385" y="250" class="content">- ValidationErrors</text>
    <text x="480" y="250" class="content">[0..*] ValidationErrorsType</text>
    <text x="385" y="270" class="content">- Reference</text>
    <text x="480" y="270" class="content">[1..1] string</text>

    <!-- ResultType -->
    <rect x="380" y="295" width="230" height="110" class="small-box"></rect>
    <text x="390" y="315" class="title">ResultType</text>
    <text x="385" y="335" class="content">- Message</text>
    <text x="490" y="335" class="content">[0..1] string</text>
    <text x="385" y="355" class="content">- Reference</text>
    <text x="490" y="355" class="content">[1..1] string</text>
    <text x="385" y="375" class="content">- MatchResult</text>
    <text x="490" y="375" class="content">[1..1] MatchResultType</text>
    <text x="385" y="395" class="content">- Match</text>
    <text x="490" y="395" class="content">[0..*] NameMatchType</text>


    <!-- Table Lines -->
    <!-- Table Lines - ResponseOnlineOwnershipVerificationType -->
    <line x1="30" y1="125" x2="330" y2="125" stroke="lightgrey"></line>
    <line x1="30" y1="127" x2="330" y2="127" stroke="lightgrey"></line>
    <line x1="30" y1="146" x2="330" y2="146" stroke="lightgrey"></line>
    <line x1="30" y1="166" x2="330" y2="166" stroke="lightgrey"></line>
    <line x1="30" y1="186" x2="330" y2="186" stroke="lightgrey"></line>

    <!-- Table Lines - AcknowledgementType -->
    <line x1="380" y1="74" x2="630" y2="74" stroke="lightgrey"></line>
    <line x1="380" y1="76" x2="630" y2="76" stroke="lightgrey"></line>
    <line x1="380" y1="96" x2="630" y2="96" stroke="lightgrey"></line>
    <line x1="380" y1="116" x2="630" y2="116" stroke="lightgrey"></line>

    <!-- Table Lines - RejectionType -->
    <line x1="380" y1="174" x2="630" y2="174" stroke="lightgrey"></line>
    <line x1="380" y1="176" x2="630" y2="176" stroke="lightgrey"></line>
    <line x1="380" y1="196" x2="630" y2="196" stroke="lightgrey"></line>
    <line x1="380" y1="216" x2="630" y2="216" stroke="lightgrey"></line>
    <line x1="380" y1="236" x2="630" y2="236" stroke="lightgrey"></line>
    <line x1="380" y1="256" x2="630" y2="256" stroke="lightgrey"></line>

    <!-- Table Lines - ResultType -->
    <line x1="380" y1="319" x2="610" y2="319" stroke="lightgrey"></line>
    <line x1="380" y1="321" x2="610" y2="321" stroke="lightgrey"></line>
    <line x1="380" y1="341" x2="610" y2="341" stroke="lightgrey"></line>
    <line x1="380" y1="361" x2="610" y2="361" stroke="lightgrey"></line>
    <line x1="380" y1="381" x2="610" y2="381" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="137" x2="380" y2="20" class="line"></line>
    <line x1="330" y1="157" x2="380" y2="60" class="line"></line>
    <line x1="330" y1="177" x2="380" y2="210" class="line"></line>
    <line x1="330" y1="197" x2="380" y2="310" class="line"></line>

</svg>