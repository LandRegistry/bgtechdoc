<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
        fill: #F9F9F9;
        stroke: #707070;
        stroke-width: 1;
        rx: 4;
        ry: 4;
        }
        .line {
        stroke: #707070;
        stroke-width: 1;
        }
        .text {
        font-family: Arial, sans-serif;
        font-size: 12px;
        fill: #000;
        }
        .title {
        font-weight: bold;
        font-size: 12px;
        }
        .content {
        font-size: 11px;
        fill: #333;
        }
        .small-box {
        fill: #FFFFFF;
        stroke: #707070;
        stroke-width: 1;
        rx: 2;
        ry: 2;
        }
    </style>

    <!-- NameMatchType -->
    <rect x="30" y="50" width="300" height="150" class="small-box"></rect>
    <text x="40" y="70" class="title">NameMatchType</text>
    <text x="40" y="90" class="content">- SubjectProperty</text>
    <text x="170" y="90" class="content">[1..1] SubjectPropertyType</text>
    <text x="40" y="110" class="content">- SurnameMatch</text>
    <text x="170" y="110" class="content">[1..1] MatchType</text>
    <text x="40" y="130" class="content">- ForenameMatchDetails</text>
    <text x="170" y="130" class="content">[1..1] MatchType</text>
    <text x="40" y="150" class="content">- MiddleNameMatchDetails</text>
    <text x="170" y="150" class="content">[0..1] MatchType</text>
    <text x="40" y="170" class="content">- StringMatchDetails</text>
    <text x="170" y="170" class="content">[0..1] MatchType</text>
    <text x="40" y="190" class="content">- MatchInformation</text>
    <text x="170" y="190" class="content">[0..*] MatchDetailsType</text>

    <!-- SubjectPropertyType -->
    <rect x="380" y="5" width="250" height="70" class="small-box"></rect>
    <text x="390" y="25" class="title">SubjectPropertyType</text>
    <text x="385" y="45" class="content">- TitleNumber</text>
    <text x="500" y="45" class="content">[1..1] (TitleNumberType)</text>
    <text x="385" y="65" class="content">- PropertyAddress</text>
    <text x="500" y="65" class="content">[1..1] PropertyAddressType</text>

    <!-- MatchType -->
    <rect x="380" y="105" width="230" height="70" class="small-box"></rect>
    <text x="390" y="125" class="title">MatchType</text>
    <text x="385" y="145" class="content">- TypeOfMatch</text>
    <text x="505" y="145" class="content">(TypeOfMatchType)</text>
    <text x="385" y="165" class="content">- MatchDetails</text>
    <text x="480" y="165" class="content">[0..*] MatchDetailsType</text>

    <!-- MatchDetailsType -->
    <rect x="380" y="225" width="180" height="70" class="small-box"></rect>
    <text x="390" y="245" class="title">MatchDetailsType</text>
    <text x="385" y="265" class="content">- Name</text>
    <text x="455" y="265" class="content">- [1..1] PartyRoleType</text>
    <text x="385" y="285" class="content">- Value</text>
    <text x="455" y="285" class="content">- [1..1] string</text>

    <!-- Table Lines -->
    <!-- Table Lines - PartyType -->
    <line x1="30" y1="75" x2="330" y2="75" stroke="lightgrey"></line>
    <line x1="30" y1="77" x2="330" y2="77" stroke="lightgrey"></line>
    <line x1="30" y1="96" x2="330" y2="96" stroke="lightgrey"></line>
    <line x1="30" y1="116" x2="330" y2="116" stroke="lightgrey"></line>
    <line x1="30" y1="136" x2="330" y2="136" stroke="lightgrey"></line>
    <line x1="30" y1="156" x2="330" y2="156" stroke="lightgrey"></line>
    <line x1="30" y1="176" x2="330" y2="176" stroke="lightgrey"></line>

    <!-- Table Lines - SubjectPropertyType -->
    <line x1="380" y1="29" x2="630" y2="29" stroke="lightgrey"></line>
    <line x1="380" y1="31" x2="630" y2="31" stroke="lightgrey"></line>
    <line x1="380" y1="50" x2="630" y2="50" stroke="lightgrey"></line>

    <!-- Table Lines - MatchType -->
    <line x1="380" y1="129" x2="610" y2="129" stroke="lightgrey"></line>
    <line x1="380" y1="131" x2="610" y2="131" stroke="lightgrey"></line>
    <line x1="380" y1="151" x2="610" y2="151" stroke="lightgrey"></line>

    <!-- Table Lines - MatchDetailsType -->
    <line x1="380" y1="249" x2="560" y2="249" stroke="lightgrey"></line>
    <line x1="380" y1="251" x2="560" y2="251" stroke="lightgrey"></line>
    <line x1="380" y1="271" x2="560" y2="271" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="86" x2="380" y2="20" class="line"></line>
    <line x1="330" y1="106" x2="380" y2="120" class="line"></line>
    <line x1="330" y1="126" x2="380" y2="120" class="line"></line>
    <line x1="330" y1="146" x2="380" y2="120" class="line"></line>
    <line x1="330" y1="166" x2="380" y2="120" class="line"></line>
    <line x1="330" y1="186" x2="380" y2="240" class="line"></line>

</svg>