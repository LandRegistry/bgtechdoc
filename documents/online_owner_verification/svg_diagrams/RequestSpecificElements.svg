<svg width="1050" height="400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
        fill: #F9F9F9;
        stroke: #707070;
        stroke-width: 1;
        rx: 4;
        ry: 4;
        }
        .line {
        stroke: #707070;
        stroke-width: 1;
        }
        .text {
        font-family: Arial, sans-serif;
        font-size: 12px;
        fill: #000;
        }
        .title {
        font-weight: bold;
        font-size: 12px;
        }
        .content {
        font-size: 11px;
        fill: #333;
        }
        .small-box {
        fill: #FFFFFF;
        stroke: #707070;
        stroke-width: 1;
        rx: 2;
        ry: 2;
        }
    </style>

    <!-- RequestOnlineOwnershipVerificationType -->
    <rect x="30" y="50" width="300" height="170" class="small-box"></rect>
