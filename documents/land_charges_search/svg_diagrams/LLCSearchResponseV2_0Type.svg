<svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- LLCSearchResponseV2_0Type -->
    <rect x="30" y="50" width="300" height="55" class="small-box"></rect>
    <text x="40" y="70" class="title">LLCSearchResponseV2_0Type</text>
    <text x="40" y="95" class="content">- GatewayResponse</text>
    <text x="160" y="95" class="content">[1..1] Q1GatewayResponseType</text>

    <!-- Q1GatewayResponseType -->
    <rect x="430" y="5" width="330" height="110" class="small-box"></rect>
    <text x="440" y="25" class="title">Q1GatewayResponseType</text>
    <text x="440" y="45" class="content">- TypeCode</text>
    <text x="590" y="45" class="content">[1..1] ProductResponseCodeType</text>
    <text x="440" y="65" class="content">- Acknowledgement</text>
    <text x="590" y="65" class="content">[0..1] Q1AcknowledgementType</text>
    <text x="440" y="85" class="content">- Rejection</text>
    <text x="590" y="85" class="content">[0..1] Q1RejectionType</text>
    <text x="440" y="105" class="content">- Results</text>
    <text x="590" y="105" class="content">[0..1] Q1ResultsType</text>

    <!-- Table Lines -->
    <!-- Table Lines - LLCSearchRequestV2_0Type -->
    <line x1="30" y1="79" x2="330" y2="79" stroke="lightgrey"></line>
    <line x1="30" y1="81" x2="330" y2="81" stroke="lightgrey"></line>


    <!-- Table Lines - Q1GatewayResponseType -->
    <line x1="430" y1="29" x2="760" y2="29" stroke="lightgrey"></line>
    <line x1="430" y1="31" x2="760" y2="31" stroke="lightgrey"></line>
    <line x1="430" y1="51" x2="760" y2="51" stroke="lightgrey"></line>
    <line x1="430" y1="71" x2="760" y2="71" stroke="lightgrey"></line>
    <line x1="430" y1="91" x2="760" y2="91" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="90" x2="430" y2="20" class="line"></line>

</svg>