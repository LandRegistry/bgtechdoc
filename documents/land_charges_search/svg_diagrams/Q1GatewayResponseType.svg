    <line x1="380" y1="171" x2="670" y2="171" stroke="lightgrey"></line>
    <line x1="380" y1="191" x2="670" y2="191" stroke="lightgrey"></line>

    <!-- Table Lines - Q1ResultsType -->
    <line x1="380" y1="259" x2="680" y2="259" stroke="lightgrey"></line>
    <line x1="380" y1="261" x2="680" y2="261" stroke="lightgrey"></line>
    <line x1="380" y1="281" x2="680" y2="281" stroke="lightgrey"></line>
    <line x1="380" y1="301" x2="680" y2="301" stroke="lightgrey"></line>
    <line x1="380" y1="321" x2="680" y2="321" stroke="lightgrey"></line>
    <line x1="380" y1="341" x2="680" y2="341" stroke="lightgrey"></line>
    <line x1="380" y1="361" x2="680" y2="361" stroke="lightgrey"></line>
    <line x1="380" y1="381" x2="680" y2="381" stroke="lightgrey"></line>
    <line x1="380" y1="401" x2="680" y2="401" stroke="lightgrey"></line>
    <line x1="380" y1="421" x2="680" y2="421" stroke="lightgrey"></line>
    <line x1="380" y1="441" x2="680" y2="441" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="350" y1="57" x2="380" y2="20" class="line"></line>
    <line x1="350" y1="77" x2="380" y2="90" class="line"></line>
    <line x1="350" y1="97" x2="380" y2="140" class="line"></line>
