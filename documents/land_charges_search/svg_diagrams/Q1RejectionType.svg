<svg width="700" height="270" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- Q1RejectionType -->
    <rect x="30" y="50" width="300" height="88" class="small-box"></rect>
    <text x="40" y="70" class="title">Q1RejectionType</text>
    <text x="40" y="90" class="content">- ExternalReference</text>
    <text x="160" y="90" class="content">[1..1] TextType</text>
    <text x="40" y="110" class="content">- ActualPrice</text>
    <text x="160" y="110" class="content">[0..1] Q1ActualPriceType</text>
    <text x="40" y="130" class="content">- RejectionResponse</text>
    <text x="160" y="130" class="content">[1..1] Q1RejectionResponseType</text>

    <!-- TextType -->
    <rect x="380" y="5" width="70" height="30" class="small-box"></rect>
    <text x="390" y="25" class="title">TextType</text>

    <!-- Q1ActualPriceType -->
    <rect x="380" y="45" width="240" height="90" class="small-box"></rect>
    <text x="390" y="65" class="title">Q1ActualPriceType</text>
    <text x="385" y="85" class="content">- GrossPriceAmount</text>
    <text x="520" y="85" class="content">[1..1] AmountType</text>
    <text x="385" y="105" class="content">- NetPriceAmount</text>
    <text x="520" y="105" class="content">[0..1] AmountType</text>
    <text x="385" y="125" class="content">- VATAmount</text>
    <text x="520" y="125" class="content">[0..1] AmountType</text>

    <!-- Q1RejectionResponseType -->
    <rect x="380" y="145" width="280" height="110" class="small-box"></rect>
    <text x="390" y="165" class="title">Q1RejectionResponseType</text>
    <text x="385" y="185" class="content">- Reason</text>
    <text x="500" y="185" class="content">[1..1] TextType</text>
    <text x="385" y="205" class="content">- Code</text>
    <text x="500" y="205" class="content">[1..1] TextType</text>
    <text x="385" y="225" class="content">- OtherDescription</text>
    <text x="500" y="225" class="content">[0..1] TextType</text>
    <text x="385" y="245" class="content">- ValidationErrors</text>
    <text x="500" y="245" class="content">[0..*] Q1ValidationErrorsType</text>

    <!-- Table Lines -->
    <!-- Table Lines - Q1RejectionType -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>
    <line x1="30" y1="97" x2="330" y2="97" stroke="lightgrey"></line>
    <line x1="30" y1="117" x2="330" y2="117" stroke="lightgrey"></line>

    <!-- Table Lines - Q1ActualPriceType -->
    <line x1="380" y1="69" x2="620" y2="69" stroke="lightgrey"></line>
    <line x1="380" y1="71" x2="620" y2="71" stroke="lightgrey"></line>
    <line x1="380" y1="91" x2="620" y2="91" stroke="lightgrey"></line>
    <line x1="380" y1="111" x2="620" y2="111" stroke="lightgrey"></line>

    <!-- Table Lines - Q1RejectionResponseType -->
    <line x1="380" y1="170" x2="660" y2="170" stroke="lightgrey"></line>
    <line x1="380" y1="172" x2="660" y2="172" stroke="lightgrey"></line>
    <line x1="380" y1="191" x2="660" y2="191" stroke="lightgrey"></line>
    <line x1="380" y1="211" x2="660" y2="211" stroke="lightgrey"></line>
    <line x1="380" y1="231" x2="660" y2="231" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="88" x2="380" y2="20" class="line"></line>
    <line x1="330" y1="108" x2="380" y2="60" class="line"></line>
    <line x1="330" y1="128" x2="380" y2="160" class="line"></line>

</svg>
