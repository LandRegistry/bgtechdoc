<svg width="900" height="550" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- Q1ResultsType -->
    <rect x="30" y="50" width="320" height="230" class="small-box"></rect>
    <text x="40" y="70" class="title">Q1ResultsType</text>
    <text x="40" y="90" class="content">- ExternalReference</text>
    <text x="200" y="90" class="content">[1..1] TextType</text>
    <text x="40" y="110" class="content">- ActualPrice</text>
    <text x="200" y="110" class="content">[1..1] Q1ActualPriceType</text>
    <text x="40" y="130" class="content">- SearchArea</text>
    <text x="200" y="130" class="content">[0..1] CData</text>
    <text x="40" y="150" class="content">- Attachment</text>
    <text x="200" y="150" class="content">[0..1] Q1AttachmentType</text>
    <text x="40" y="170" class="content">- SearchDateTime</text>
    <text x="200" y="170" class="content">[1..1] DateTimeType</text>
    <text x="40" y="190" class="content">- SearchDescription</text>
    <text x="200" y="190" class="content">[1..1] string</text>
    <text x="40" y="210" class="content">- NumberSearchesFound</text>
    <text x="200" y="210" class="content">[1..1] integer</text>
    <text x="40" y="230" class="content">- Charges</text>
    <text x="200" y="230" class="content">[0..1] LocalLandChargeType</text>
    <text x="40" y="250" class="content">- ChargesAlternateFormat</text>
    <text x="200" y="250" class="content">[0..1] CData</text>
    <text x="40" y="270" class="content">- SearchReference</text>
    <text x="200" y="270" class="content">[1..1] TextType</text>

    <!-- TextType -->
    <rect x="440" y="5" width="70" height="30" class="small-box"></rect>
    <text x="450" y="25" class="title">TextType</text>

    <!-- Q1ActualPriceType -->
    <rect x="440" y="65" width="250" height="90" class="small-box"></rect>
    <text x="450" y="85" class="title">Q1ActualPriceType</text>
    <text x="445" y="105" class="content">- GrossPriceAmount</text>
    <text x="590" y="105" class="content">[1..1] AmountType</text>
    <text x="445" y="125" class="content">- NetPriceAmount</text>
    <text x="590" y="125" class="content">[0..1] AmountType</text>
    <text x="445" y="145" class="content">- VATAmount</text>
    <text x="590" y="145" class="content">[0..1] AmountType</text>

    <!-- CData -->
    <rect x="440" y="185" width="150" height="50" class="small-box"></rect>
    <text x="450" y="205" class="title">CData</text>
    <text x="445" y="225" class="content">- format</text>
    <text x="550" y="225" class="content">string</text>

    <!-- Q1AttachmentType -->
    <rect x="440" y="265" width="300" height="130" class="small-box"></rect>
    <text x="450" y="285" class="title">Q1AttachmentType</text>
    <text x="445" y="305" class="content">- EmbeddedFileBinaryObject</text>
    <text x="610" y="305" class="content">[1..1] BinaryObjectType</text>
    <text x="445" y="325" class="content">- Title</text>
    <text x="610" y="325" class="content">[0..1] TextType</text>
    <text x="445" y="345" class="content">- Description</text>
    <text x="610" y="345" class="content">[0..1] TextType</text>
    <text x="445" y="365" class="content">- Date</text>
    <text x="610" y="365" class="content">[0..1] DateType</text>
    <text x="445" y="385" class="content">- CopyrightNotice</text>
    <text x="610" y="385" class="content">[0..1] TextType</text>

    <!-- DateTimeType -->
    <rect x="440" y="415" width="100" height="30" class="small-box"></rect>
    <text x="450" y="435" class="title">DateTimeType</text>

    <!-- LocalLandChargeType -->
    <rect x="440" y="465" width="300" height="50" class="small-box"></rect>
    <text x="450" y="485" class="title">LocalLandChargeType</text>
    <text x="445" y="505" class="content">- LocalLandCharge <tspan dx="40">[0..*] LocalLandChargeContent</tspan></text>

    <!-- Table Lines -->
    <!-- Table Lines - Q1ResultsType -->
    <line x1="30" y1="74" x2="350" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="350" y2="76" stroke="lightgrey"></line>
    <line x1="30" y1="97" x2="350" y2="97" stroke="lightgrey"></line>
    <line x1="30" y1="117" x2="350" y2="117" stroke="lightgrey"></line>
    <line x1="30" y1="137" x2="350" y2="137" stroke="lightgrey"></line>
    <line x1="30" y1="157" x2="350" y2="157" stroke="lightgrey"></line>
    <line x1="30" y1="177" x2="350" y2="177" stroke="lightgrey"></line>
    <line x1="30" y1="197" x2="350" y2="197" stroke="lightgrey"></line>
    <line x1="30" y1="217" x2="350" y2="217" stroke="lightgrey"></line>
    <line x1="30" y1="237" x2="350" y2="237" stroke="lightgrey"></line>
    <line x1="30" y1="257" x2="350" y2="257" stroke="lightgrey"></line>

    <!-- Table Lines - Q1ActualPriceType -->
    <line x1="440" y1="89" x2="690" y2="89" stroke="lightgrey"></line>
    <line x1="440" y1="91" x2="690" y2="91" stroke="lightgrey"></line>
    <line x1="440" y1="111" x2="690" y2="111" stroke="lightgrey"></line>
    <line x1="440" y1="131" x2="690" y2="131" stroke="lightgrey"></line>

    <!-- Table Lines - CData -->
    <line x1="440" y1="209" x2="590" y2="209" stroke="lightgrey"></line>
    <line x1="440" y1="211" x2="590" y2="211" stroke="lightgrey"></line>

    <!-- Table Lines - Q1AttachmentType -->
    <line x1="440" y1="289" x2="740" y2="289" stroke="lightgrey"></line>
    <line x1="440" y1="291" x2="740" y2="291" stroke="lightgrey"></line>
    <line x1="440" y1="311" x2="740" y2="311" stroke="lightgrey"></line>
    <line x1="440" y1="331" x2="740" y2="331" stroke="lightgrey"></line>
    <line x1="440" y1="351" x2="740" y2="351" stroke="lightgrey"></line>
    <line x1="440" y1="371" x2="740" y2="371" stroke="lightgrey"></line>

    <!-- Table Lines - LocalLandChargeType -->
    <line x1="440" y1="490" x2="740" y2="490" stroke="lightgrey"></line>
    <line x1="440" y1="492" x2="740" y2="492" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="350" y1="90" x2="440" y2="20" class="line"></line>
    <line x1="350" y1="107" x2="440" y2="80" class="line"></line>
    <line x1="350" y1="127" x2="440" y2="200" class="line"></line>
    <line x1="350" y1="147" x2="440" y2="280" class="line"></line>
    <line x1="350" y1="167" x2="440" y2="430" class="line"></line>
    <line x1="350" y1="227" x2="440" y2="480" class="line"></line>
    <line x1="350" y1="247" x2="440" y2="200" class="line"></line>
    <line x1="350" y1="267" x2="440" y2="20" class="line"></line>

</svg>
