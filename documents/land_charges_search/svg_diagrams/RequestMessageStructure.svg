<svg width="700" height="230" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- LLCSearch -->
    <rect x="30" y="50" width="90" height="30" class="small-box"></rect>
    <text x="40" y="70" class="title">LLCSearch</text>

    <!-- LLCSearchRequestV2_0Type -->
    <rect x="230" y="5" width="330" height="210" class="small-box"></rect>
    <text x="240" y="25" class="title">LLCSearchRequestV2_0Type</text>
    <text x="240" y="45" class="content">- MessageId</text>
    <text x="390" y="45" class="content">[1..1] MessageIdType</text>
    <text x="240" y="65" class="content">- Reference</text>
    <text x="390" y="65" class="content">[1..1] ReferenceTextContentType</text>
    <text x="240" y="85" class="content">- FeeInPence</text>
    <text x="390" y="85" class="content">[0..1] nonNegativeInteger</text>
    <text x="240" y="105" class="content">- RefreshSearchReference</text>
    <text x="390" y="105" class="content">[1..1] SearchReferenceTextType</text>
    <text x="240" y="125" class="content">- TitleNumber</text>
    <text x="390" y="125" class="content">[1..1] TitleType</text>
    <text x="240" y="145" class="content">- GeoJson</text>
    <text x="390" y="145" class="content">[1..1] CDATA</text>
    <text x="240" y="165" class="content">- PropertyDescription</text>
    <text x="418" y="165" class="content">PropertyDescriptionType</text>
    <text x="240" y="185" class="content">- ResponseFormat</text>
    <text x="390" y="185" class="content">[1..1] ResponseFormatContent</text>
    <text x="240" y="205" class="content">- GeoJson</text>
    <text x="390" y="205" class="content">[1..1] IndicatorsType</text>


    <!-- Table Lines -->
    <!-- Table Lines - LLCSearchRequestV2_0Type -->
    <line x1="230" y1="29" x2="560" y2="29" stroke="lightgrey"></line>
    <line x1="230" y1="31" x2="560" y2="31" stroke="lightgrey"></line>
    <line x1="230" y1="51" x2="560" y2="51" stroke="lightgrey"></line>
