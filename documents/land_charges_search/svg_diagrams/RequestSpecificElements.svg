    <text x="40" y="95"  class="content">- MessageId</text>
    <text x="180" y="95" class="content">[1..1] MessageIdType</text>
    <text x="40" y="115" class="content">- Reference</text>
    <text x="180" y="115" class="content">[1..1] ReferenceTextContextType</text>
