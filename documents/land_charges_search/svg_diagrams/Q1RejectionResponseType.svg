<svg width="700" height="250" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- Q1RejectionResponseType -->
    <rect x="30" y="50" width="300" height="108" class="small-box"></rect>
    <text x="40" y="70" class="title">Q1RejectionResponseType</text>
    <text x="40" y="90" class="content">- Reason</text>
    <text x="160" y="90" class="content">[1..1] TextType</text>
    <text x="40" y="110" class="content">- Code</text>
    <text x="160" y="110" class="content">[1..1] TextType</text>
    <text x="40" y="130" class="content">- OtherDescription</text>
    <text x="160" y="130" class="content">[0..1] TextType</text>
    <text x="40" y="150" class="content">- ValidationErrors</text>
    <text x="160" y="150" class="content">[0..*] Q1ValidationErrorsType</text>

    <!-- TextType -->
    <rect x="380" y="5" width="70" height="30" class="small-box"></rect>
    <text x="390" y="25" class="title">TextType</text>

    <!-- Q1ValidationErrorsType -->
    <rect x="380" y="145" width="210" height="70" class="small-box"></rect>
    <text x="390" y="165" class="title">Q1ValidationErrorsType</text>
    <text x="385" y="185" class="content">- Code</text>
    <text x="500" y="185" class="content">[1..1] TextType</text>
    <text x="385" y="205" class="content">- Description</text>
    <text x="500" y="205" class="content">[1..1] TextType</text>

    <!-- Table Lines -->
    <!-- Table Lines - Q1RejectionResponseType -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>
    <line x1="30" y1="97" x2="330" y2="97" stroke="lightgrey"></line>
    <line x1="30" y1="117" x2="330" y2="117" stroke="lightgrey"></line>
    <line x1="30" y1="137" x2="330" y2="137" stroke="lightgrey"></line>

    <!-- Table Lines - Q1ValidationErrorsType -->
    <line x1="380" y1="170" x2="590" y2="170" stroke="lightgrey"></line>
    <line x1="380" y1="172" x2="590" y2="172" stroke="lightgrey"></line>
    <line x1="380" y1="191" x2="590" y2="191" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="88" x2="380" y2="20" class="line"></line>
    <line x1="330" y1="148" x2="380" y2="160" class="line"></line>

</svg>
