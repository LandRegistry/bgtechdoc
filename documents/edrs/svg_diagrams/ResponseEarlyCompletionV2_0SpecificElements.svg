<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- ResponseEarlyCompletionV2_0Type -->
    <rect x="30" y="50" width="300" height="50" class="small-box"></rect>
    <text x="40" y="70" class="title">ResponseEarlyCompletionV2_0Type</text>
    <text x="40" y="90" class="content">- GatewayResponse <tspan dx="35">[1..1] GatewayResponseType</tspan></text>

    <!-- GatewayResponseType -->
    <rect x="400" y="5" width="310" height="70" class="small-box"></rect>
    <text x="405" y="25" class="title">GatewayResponseType</text>
    <text x="405" y="45" class="content">- TypeCode</text>
    <text x="500" y="45" class="content">[1..1] ProductResponseCodeContentType</text>
    <text x="405" y="65" class="content">- EarlyCompletion</text>
    <text x="500" y="65" class="content">[1..1] EarlyCompletionType</text>

    <!-- Table Lines -->
    <!-- Table Lines - ResponseEarlyCompletionV2_0Type -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>

    <!-- Table Lines - GatewayResponseType -->
    <line x1="400" y1="29" x2="710" y2="29" stroke="lightgrey"></line>
    <line x1="400" y1="31" x2="710" y2="31" stroke="lightgrey"></line>
    <line x1="400" y1="51" x2="710" y2="51" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="87" x2="400" y2="20" class="line"></line>

</svg>