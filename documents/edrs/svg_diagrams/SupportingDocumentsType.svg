<svg width="900" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- SupportingDocumentsType -->
    <rect x="30" y="50" width="300" height="50" class="small-box"></rect>
    <text x="40" y="70" class="title">SupportingDocumentsType</text>
    <text x="40" y="90" class="content">- SupportingDocument <tspan dx="15">[1..1] SupportingDocumentType</tspan></text>


    <!-- SupportingDocumentType -->
    <rect x="380" y="5" width="260" height="70" class="small-box"></rect>
    <text x="390" y="25" class="title">SupportingDocumentType</text>
    <text x="385" y="45" class="content">- DocumentId</text>
    <text x="490" y="45" class="content">[1..1] positiveInteger</text>
    <text x="385" y="65" class="content">- DocumentName</text>
    <text x="490" y="65" class="content">[1..1] DocumentNameContent</text>

    <!-- DocumentNameContent -->
    <rect x="680" y="65" width="155" height="30" class="small-box"></rect>
    <text x="690" y="85" class="title">DocumentNameContent</text>

    <!-- Table Lines -->
    <!-- Table Lines - SupportingDocumentsType -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>

    <!-- Table Lines - SupportingDocumentType -->
    <line x1="380" y1="29" x2="640" y2="29" stroke="lightgrey"></line>
    <line x1="380" y1="31" x2="640" y2="31" stroke="lightgrey"></line>
    <line x1="380" y1="50" x2="640" y2="50" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="88" x2="380" y2="20" class="line"></line>
    <line x1="640" y1="62" x2="680" y2="80" class="line"></line>

</svg>