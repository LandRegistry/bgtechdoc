<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- DealingType -->
    <rect x="30" y="50" width="270" height="50" class="small-box"></rect>
    <text x="40" y="70" class="title">DealingType</text>
    <text x="40" y="90" class="content">- DealingTitles <tspan dx="97">[1..1] TitlesType</tspan></text>

    <!-- TitlesType -->
    <rect x="380" y="5" width="260" height="50" class="small-box"></rect>
    <text x="390" y="25" class="title">TitlesType</text>
    <text x="385" y="45" class="content">- TitleNumber <tspan dx="95">[1..1] TitleType</tspan></text>

    <!-- TitlesType -->
    <rect x="700" y="65" width="70" height="30" class="small-box"></rect>
    <text x="710" y="85" class="title">TitleType</text>


    <!-- Table Lines -->
    <!-- Table Lines - DealingType -->
    <line x1="30" y1="74" x2="300" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="300" y2="76" stroke="lightgrey"></line>

    <!-- Table Lines - TitlesType -->
    <line x1="380" y1="29" x2="640" y2="29" stroke="lightgrey"></line>
    <line x1="380" y1="31" x2="640" y2="31" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="300" y1="90" x2="380" y2="20" class="line"></line>
    <line x1="640" y1="42" x2="700" y2="80" class="line"></line>

</svg>