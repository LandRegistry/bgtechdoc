<svg width="500" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- LeaseExtensionType -->
    <rect x="30" y="50" width="210" height="90" class="small-box"></rect>
    <text x="40" y="70" class="title">LeaseExtensionType</text>
    <text x="40" y="90" class="content">- LessorTitles</text>
    <text x="150" y="90" class="content">[1..1] TitlesType</text>
    <text x="40" y="110" class="content">- LesseeTitles</text>
    <text x="150" y="110" class="content">[1..1] TitleType</text>
    <text x="40" y="130" class="content">- AdditionalTitles</text>
    <text x="150" y="130" class="content">[0..1] TitlesType</text>

    <!-- TitlesType -->
    <rect x="280" y="5" width="200" height="50" class="small-box"></rect>
    <text x="290" y="25" class="title">TitlesType</text>
    <text x="285" y="45" class="content">- TitleNumber <tspan dx="45">[1..1] TitleType</tspan></text>

    <!-- TitleType -->
    <rect x="280" y="85" width="70" height="30" class="small-box"></rect>
    <text x="290" y="105" class="title">TitleType</text>

    <!-- Table Lines -->
    <!-- Table Lines - LeaseExtensionType -->
    <line x1="30" y1="75" x2="240" y2="75" stroke="lightgrey"></line>
    <line x1="30" y1="77" x2="240" y2="77" stroke="lightgrey"></line>
    <line x1="30" y1="96" x2="240" y2="96" stroke="lightgrey"></line>
    <line x1="30" y1="116" x2="240" y2="116" stroke="lightgrey"></line>

    <!-- Table Lines - TitlesType -->
    <line x1="280" y1="29" x2="480" y2="29" stroke="lightgrey"></line>
    <line x1="280" y1="31" x2="480" y2="31" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="240" y1="90" x2="280" y2="20" class="line"></line>
    <line x1="240" y1="130" x2="280" y2="20" class="line"></line>
    <line x1="240" y1="106" x2="280" y2="100" class="line"></line>

</svg>