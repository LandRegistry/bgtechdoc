<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- PollRequestType -->
    <rect x="30" y="50" width="160" height="50" class="small-box"></rect>
    <text x="40" y="70" class="title">PollRequestType</text>
    <text x="40" y="90" class="content">- ID <tspan dx="15">[1..1] Q1IdentifierType</tspan></text>

    <!-- Q1IdentifierType -->
    <rect x="280" y="5" width="260" height="50" class="small-box"></rect>
    <text x="290" y="25" class="title">Q1IdentifierType</text>
    <text x="285" y="45" class="content">- MessageID <tspan dx="50">[1..1] MessageIDTextType</tspan></text>

    <!-- MessageIDTextType -->
    <rect x="600" y="65" width="130" height="30" class="small-box"></rect>
    <text x="610" y="85" class="title">MessageIDTextType</text>

    <!-- Table Lines -->
    <!-- Table Lines - PollRequestType -->
    <line x1="30" y1="74" x2="190" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="190" y2="76" stroke="lightgrey"></line>

    <!-- Table Lines - Q1IdentifierType -->
    <line x1="280" y1="29" x2="540" y2="29" stroke="lightgrey"></line>
    <line x1="280" y1="31" x2="540" y2="31" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="190" y1="88" x2="280" y2="20" class="line"></line>
    <line x1="540" y1="42" x2="600" y2="80" class="line"></line>

</svg>