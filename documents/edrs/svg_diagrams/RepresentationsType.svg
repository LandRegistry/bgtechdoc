<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- RepresentationsType -->
    <rect x="30" y="50" width="300" height="110" class="small-box"></rect>
    <text x="40" y="70" class="title">RepresentationsType</text>
    <text x="40" y="90" class="content">- LodgingConveyancer</text>
    <text x="170" y="90" class="content">[1..1] LodgingConveyancerType</text>
    <text x="40" y="110" class="content">- Value</text>
    <text x="170" y="110" class="content">[1..1] NonBlankTextType</text>
    <text x="40" y="130" class="content">- FeeInPence</text>
    <text x="170" y="130" class="content">[1..1] nonNegativeInteger</text>
    <text x="40" y="150" class="content">- Document</text>
    <text x="170" y="150" class="content">[0..1] DocumentType</text>

    <!-- LodgingConveyancerType -->
    <rect x="380" y="5" width="165" height="30" class="small-box"></rect>
    <text x="390" y="25" class="title">LodgingConveyancerType</text>

    <!-- RepresentingConveyancerType -->
    <rect x="380" y="55" width="260" height="110" class="small-box"></rect>
    <text x="390" y="75" class="title">RepresentingConveyancerType</text>
    <text x="385" y="95" class="content">- ConveyancerName</text>
    <text x="500" y="95" class="content">[1..1] NonBlankTextType</text>
    <text x="385" y="115" class="content">- Reference</text>
    <text x="500" y="115" class="content">[1..1] NonBlankTextType</text>
    <text x="385" y="135" class="content">- DXAddress</text>
    <text x="500" y="135" class="content">[1..1] DXAddressType</text>
    <text x="385" y="155" class="content">- PostalAddress</text>
    <text x="500" y="155" class="content">[1..1] PostalAddressType</text>

    <!-- CertifiedType -->
    <rect x="380" y="185" width="95" height="30" class="small-box"></rect>
    <text x="390" y="205" class="title">CertifiedType</text>

    <!-- IdentityEvidenceType -->
    <rect x="380" y="225" width="140" height="30" class="small-box"></rect>
    <text x="390" y="245" class="title">IdentityEvidenceType</text>

    <!-- Table Lines -->
    <!-- Table Lines - RepresentationsType -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>
    <line x1="30" y1="96" x2="330" y2="96" stroke="lightgrey"></line>
    <line x1="30" y1="116" x2="330" y2="116" stroke="lightgrey"></line>
    <line x1="30" y1="136" x2="330" y2="136" stroke="lightgrey"></line>

    <!-- Table Lines - RepresentingConveyancerType -->
    <line x1="380" y1="79" x2="640" y2="79" stroke="lightgrey"></line>
    <line x1="380" y1="81" x2="640" y2="81" stroke="lightgrey"></line>
    <line x1="380" y1="100" x2="640" y2="100" stroke="lightgrey"></line>
    <line x1="380" y1="120" x2="640" y2="120" stroke="lightgrey"></line>
    <line x1="380" y1="140" x2="640" y2="140" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="88" x2="380" y2="20" class="line"></line>
    <line x1="330" y1="107" x2="380" y2="70" class="line"></line>
    <line x1="330" y1="127" x2="380" y2="200" class="line"></line>
    <line x1="330" y1="147" x2="380" y2="240" class="line"></line>

</svg>