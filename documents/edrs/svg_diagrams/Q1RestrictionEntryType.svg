<svg width="1200" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- Q1RestrictionDetailsType -->
    <rect x="30" y="50" width="270" height="50" class="small-box"></rect>
    <text x="40" y="70" class="title">Q1RestrictionDetailsType</text>
    <text x="40" y="90" class="content">- RestrictionEntry <tspan dx="25">[1..*] Q1RestrictionEntryType</tspan></text>

    <!-- Q1RestrictionEntryType -->
    <rect x="380" y="5" width="300" height="90" class="small-box"></rect>
    <text x="390" y="25" class="title">Q1RestrictionEntryType</text>
    <text x="390" y="45" class="content">- ChargeRelatedRestriction</text>
    <text x="550" y="45" class="content">[0..1] Q1RestrictionType</text>
    <text x="390" y="65" class="content">- ChargeRestriction</text>
    <text x="550" y="65" class="content">[0..1] Q1RestrictionType</text>
    <text x="390" y="85" class="content">- NonChargeRestriction</text>
    <text x="550" y="85" class="content">[0..1] Q1RestrictionType</text>

    <!-- Table Lines -->
    <!-- Table Lines - Q1RestrictionEntryType -->
    <line x1="30" y1="74" x2="300" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="300" y2="76" stroke="lightgrey"></line>

    <!-- Table Lines - Q1LeaseType -->
    <line x1="380" y1="29" x2="680" y2="29" stroke="lightgrey"></line>
    <line x1="380" y1="31" x2="680" y2="31" stroke="lightgrey"></line>
    <line x1="380" y1="51" x2="680" y2="51" stroke="lightgrey"></line>
    <line x1="380" y1="71" x2="680" y2="71" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="300" y1="87" x2="380" y2="20" class="line"></line>

</svg>