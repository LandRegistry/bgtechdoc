<svg width="850" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- ApplicationType -->
    <rect x="30" y="50" width="300" height="110" class="small-box"></rect>
    <text x="40" y="70" class="title">ApplicationType</text>
    <text x="40" y="90" class="content">- Priority</text>
    <text x="180" y="90" class="content">[1..1] positiveInteger</text>
    <text x="40" y="110" class="content">- Value</text>
    <text x="180" y="110" class="content">[1..1] NonBlankTextType</text>
    <text x="40" y="130" class="content">- FeeInPence</text>
    <text x="180" y="130" class="content">[1..1] nonNegativeInteger</text>
    <text x="40" y="150" class="content">- Document</text>
    <text x="180" y="150" class="content">[0..1] DocumentType</text>

    <!-- DocumentType -->
    <rect x="380" y="85" width="260" height="50" class="small-box"></rect>
    <text x="390" y="105" class="title">DocumentType</text>
    <text x="385" y="125" class="content">- CertifiedCopy <tspan dx="35">[1..1] CertifiedTypeContent</tspan></text>

    <!-- CertifiedTypeContent -->
    <rect x="680" y="65" width="140" height="30" class="small-box"></rect>
    <text x="690" y="85" class="title">CertifiedTypeContent</text>

    <!-- NonBlankTextType -->
    <rect x="380" y="5" width="125" height="30" class="small-box"></rect>
    <text x="390" y="25" class="title">NonBlankTextType</text>

    <!-- Table Lines -->
    <!-- Table Lines - ApplicationType -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>
    <line x1="30" y1="96" x2="330" y2="96" stroke="lightgrey"></line>
    <line x1="30" y1="116" x2="330" y2="116" stroke="lightgrey"></line>
    <line x1="30" y1="136" x2="330" y2="136" stroke="lightgrey"></line>

    <!-- Table Lines - CertifiedTypeContent -->
    <line x1="380" y1="109" x2="640" y2="109" stroke="lightgrey"></line>
    <line x1="380" y1="111" x2="640" y2="111" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="108" x2="380" y2="20" class="line"></line>
    <line x1="330" y1="148" x2="380" y2="100" class="line"></line>
    <line x1="640" y1="122" x2="680" y2="80" class="line"></line>

</svg>