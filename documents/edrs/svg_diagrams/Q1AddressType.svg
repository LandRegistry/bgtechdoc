<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- Q1AddressType -->
    <rect x="30" y="50" width="300" height="70" class="small-box"></rect>
    <text x="40" y="70" class="title">Q1AddressType</text>
    <text x="40" y="90" class="content">- PostcodeZone</text>
    <text x="180" y="90" class="content">[0..1] Q1PostcodeZoneType</text>
    <text x="40" y="110" class="content">- AddressLine</text>
    <text x="180" y="110" class="content">[1..1] AddressLineType</text>

    <!-- Q1PostcodeZoneType -->
    <rect x="380" y="5" width="210" height="50" class="small-box"></rect>
    <text x="390" y="25" class="title">Q1PostcodeZoneType</text>
    <text x="390" y="45" class="content">- Postcode <tspan dx="40">[1..1] TextType</tspan></text>

    <!-- AddressLineType -->
    <rect x="380" y="80" width="210" height="70" class="small-box"></rect>
    <text x="390" y="100" class="title">AddressLineType</text>
    <text x="385" y="120" class="content">- IndexNumeric</text>
    <text x="480" y="120" class="content">[0..*] NumericType</text>
    <text x="385" y="140" class="content">- Line</text>
    <text x="480" y="140" class="content">[0..*] TextType</text>


    <!-- Table Lines -->
    <!-- Table Lines - Q1AddressType -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>
    <line x1="30" y1="96" x2="330" y2="96" stroke="lightgrey"></line>

    <!-- Table Lines - Q1PostcodeZoneType -->
    <line x1="380" y1="29" x2="590" y2="29" stroke="lightgrey"></line>
    <line x1="380" y1="31" x2="590" y2="31" stroke="lightgrey"></line>

    <!-- Table Lines - AddressLineType -->
    <line x1="380" y1="108" x2="590" y2="108" stroke="lightgrey"></line>
    <line x1="380" y1="106" x2="590" y2="106" stroke="lightgrey"></line>
    <line x1="380" y1="126" x2="590" y2="126" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="90" x2="380" y2="20" class="line"></line>
    <line x1="330" y1="107" x2="380" y2="95" class="line"></line>

</svg>