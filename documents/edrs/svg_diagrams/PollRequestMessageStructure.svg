<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- PollRequest -->
    <rect x="30" y="50" width="90" height="30" class="small-box"></rect>
    <text x="40" y="70" class="title">PollRequest</text>

    <!-- PollRequestType -->
    <rect x="200" y="5" width="200" height="50" class="small-box"></rect>
    <text x="210" y="25" class="title">PollRequestType</text>
    <text x="205" y="45" class="content">- ID <tspan dx="50">[1..1] Q1IdentifierType</tspan></text>

    <!-- Table Lines -->
    <!-- Table Lines - PollRequestType -->
    <line x1="200" y1="29" x2="400" y2="29" stroke="lightgrey"></line>
    <line x1="200" y1="31" x2="400" y2="31" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="120" y1="67" x2="200" y2="20" class="line"></line>

</svg>