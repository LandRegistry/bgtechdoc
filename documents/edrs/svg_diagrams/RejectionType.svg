<svg width="1000" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- RejectionType -->
    <rect x="30" y="50" width="300" height="70" class="small-box"></rect>
    <text x="40" y="70" class="title">ApplicationsType</text>
    <text x="40" y="90" class="content">- ExternalReference</text>
    <text x="180" y="90" class="content">[1..1] string</text>
    <text x="40" y="110" class="content">- RejectionResponse</text>
    <text x="180" y="110" class="content">[1..1] RejectionResponseType</text>

    <!-- RejectionResponseType -->
    <rect x="380" y="5" width="260" height="110" class="small-box"></rect>
    <text x="390" y="25" class="title">RejectionResponseType</text>
    <text x="390" y="45" class="content">- Reason</text>
    <text x="500" y="45" class="content">[1..1] string</text>
    <text x="390" y="65" class="content">- Code</text>
    <text x="500" y="65" class="content">[1..1] string</text>
    <text x="390" y="85" class="content">- OtherDescription</text>
    <text x="500" y="85" class="content">[1..1] string</text>
    <text x="390" y="105" class="content">- ValidationErrors</text>
    <text x="500" y="105" class="content">[0..*] ValidationErrorsType</text>

    <!-- ValidationErrorsType -->
    <rect x="690" y="15" width="180" height="70" class="small-box"></rect>
    <text x="695" y="35" class="title">ValidationErrorsType</text>
    <text x="695" y="55" class="content">- Code</text>
    <text x="810" y="55" class="content">[1..1] string</text>
    <text x="695" y="75" class="content">- Description</text>
    <text x="810" y="75" class="content">[1..1] string</text>


    <!-- Table Lines -->
    <!-- Table Lines - RejectionType -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>
    <line x1="30" y1="96" x2="330" y2="96" stroke="lightgrey"></line>

    <!-- Table Lines - RejectionResponseType -->
    <line x1="380" y1="29" x2="640" y2="29" stroke="lightgrey"></line>
    <line x1="380" y1="31" x2="640" y2="31" stroke="lightgrey"></line>
    <line x1="380" y1="51" x2="640" y2="51" stroke="lightgrey"></line>
    <line x1="380" y1="71" x2="640" y2="71" stroke="lightgrey"></line>
    <line x1="380" y1="91" x2="640" y2="91" stroke="lightgrey"></line>

    <!-- Table Lines - ValidationErrorsType -->
    <line x1="690" y1="39" x2="870" y2="39" stroke="lightgrey"></line>
    <line x1="690" y1="41" x2="870" y2="41" stroke="lightgrey"></line>
    <line x1="690" y1="61" x2="870" y2="61" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="107" x2="380" y2="20" class="line"></line>
    <line x1="640" y1="105" x2="690" y2="30" class="line"></line>


</svg>