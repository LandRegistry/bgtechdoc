<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
        </marker>
    </defs>

    <!-- base64Binary -->
    <rect x="40" y="4" width="100" height="30" class="small-box"></rect>
    <text x="50" y="24" class="title">base64Binary</text>

    <!-- AttachmentType -->
    <rect x="30" y="90" width="150" height="70" class="small-box"></rect>
    <text x="40" y="110" class="title">AttachmentType</text>
    <text x="40" y="130" class="content">- filename</text>
    <text x="140" y="130" class="content">string</text>
    <text x="40" y="150" class="content">- format</text>
    <text x="140" y="150" class="content">string</text>

    <!-- Table Lines -->
    <!-- Table Lines - AttachmentType -->
    <line x1="30" y1="114" x2="180" y2="114" stroke="lightgrey"></line>
    <line x1="30" y1="116" x2="180" y2="116" stroke="lightgrey"></line>
    <line x1="30" y1="136" x2="180" y2="136" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="90" y1="90" x2="90" y2="54" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

</svg>