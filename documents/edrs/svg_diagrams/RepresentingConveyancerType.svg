<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
        </marker>
    </defs>

    <!-- RepresentativeType -->
    <rect x="30" y="4" width="220" height="50" class="small-box"></rect>
    <text x="40" y="24" class="title">RepresentativeType</text>
    <text x="40" y="44" class="content">- RepresentativeType <tspan dx="25">positiveInteger</tspan></text>

    <!-- RepresentingConveyancerType -->
    <rect x="30" y="100" width="260" height="110" class="small-box"></rect>
    <text x="40" y="120" class="title">RepresentingConveyancerType</text>
    <text x="40" y="140" class="content">- ConveyancerName</text>
    <text x="160" y="140" class="content">[1..1] NonBlankTextType</text>
    <text x="40" y="160" class="content">- Reference</text>
    <text x="160" y="160" class="content">[1..1] NonBankTextType</text>
    <text x="40" y="180" class="content">- DXAddress></text>
    <text x="160" y="180" class="content">[1..1] DXAddressType</text>
    <text x="40" y="200" class="content">- PostalAddress</text>
    <text x="160" y="200" class="content">[1..1] PostalAddressType</text>

    <!-- NonBlankTextType -->
    <rect x="330" y="20" width="125" height="30" class="small-box"></rect>
    <text x="340" y="40" class="title">NonBlankTextType</text>

    <!-- DXAddressType -->
    <rect x="330" y="80" width="250" height="70" class="small-box"></rect>
    <text x="340" y="100" class="title">DXAddressType</text>
    <text x="340" y="120" class="content">- DXNumber</text>
    <text x="450" y="120" class="content">[1..1] NonBankTextType</text>
    <text x="340" y="140" class="content">- DXExchange</text>
    <text x="450" y="140" class="content">[1..1] NonBankTextType</text>


    <!-- PostalAddressType -->
    <rect x="330" y="170" width="230" height="190" class="small-box"></rect>
    <text x="340" y="190" class="title">PostalAddressType</text>
    <text x="340" y="210" class="content">- AddressLine1</text>
    <text x="435" y="210" class="content">[1..1] NonBankTextType</text>
    <text x="340" y="230" class="content">- AddressLine2</text>
    <text x="435" y="230" class="content">[0..1] NonBankTextType</text>
    <text x="340" y="250" class="content">- AddressLine3</text>
    <text x="435" y="250" class="content">[0..1] NonBankTextType</text>
    <text x="340" y="270" class="content">- AddressLine4</text>
    <text x="435" y="270" class="content">[0..1] NonBankTextType</text>
    <text x="340" y="290" class="content">- City</text>
    <text x="435" y="290" class="content">[0..1] NonBankTextType</text>
    <text x="340" y="310" class="content">- County</text>
    <text x="435" y="310" class="content">[0..1] NonBankTextType</text>
    <text x="340" y="330" class="content">- Country</text>
    <text x="435" y="330" class="content">[0..1] NonBankTextType</text>
    <text x="340" y="350" class="content">- Postcode</text>
    <text x="435" y="350" class="content">[0..1] NonBankTextType</text>

    <!-- Table Lines -->
    <!-- Table Lines - RepresentativeType -->
    <line x1="30" y1="29" x2="250" y2="29" stroke="lightgrey"></line>
    <line x1="30" y1="31" x2="250" y2="31" stroke="lightgrey"></line>

    <!-- Table Lines - RepresentatingConveyancerType -->
    <line x1="30" y1="126" x2="290" y2="126" stroke="lightgrey"></line>
    <line x1="30" y1="128" x2="290" y2="128" stroke="lightgrey"></line>
    <line x1="30" y1="147" x2="290" y2="147" stroke="lightgrey"></line>
    <line x1="30" y1="167" x2="290" y2="167" stroke="lightgrey"></line>
    <line x1="30" y1="187" x2="290" y2="187" stroke="lightgrey"></line>

    <!-- Table Lines - DXAddressType -->
    <line x1="330" y1="104" x2="580" y2="104" stroke="lightgrey"></line>
    <line x1="330" y1="106" x2="580" y2="106" stroke="lightgrey"></line>
    <line x1="330" y1="126" x2="580" y2="126" stroke="lightgrey"></line>

    <!-- Table Lines - PostalAddressType -->
    <line x1="330" y1="194" x2="560" y2="194" stroke="lightgrey"></line>
    <line x1="330" y1="196" x2="560" y2="196" stroke="lightgrey"></line>
    <line x1="330" y1="216" x2="560" y2="216" stroke="lightgrey"></line>
    <line x1="330" y1="236" x2="560" y2="236" stroke="lightgrey"></line>
    <line x1="330" y1="256" x2="560" y2="256" stroke="lightgrey"></line>
    <line x1="330" y1="276" x2="560" y2="276" stroke="lightgrey"></line>
    <line x1="330" y1="296" x2="560" y2="296" stroke="lightgrey"></line>
    <line x1="330" y1="316" x2="560" y2="316" stroke="lightgrey"></line>
    <line x1="330" y1="336" x2="560" y2="336" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="290" y1="135" x2="330" y2="35" class="line"></line>
    <line x1="290" y1="160" x2="330" y2="35" class="line"></line>
    <line x1="290" y1="180" x2="330" y2="95" class="line"></line>
    <line x1="290" y1="197" x2="330" y2="185" class="line"></line>
    <line x1="135" y1="100" x2="135" y2="74" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

</svg>