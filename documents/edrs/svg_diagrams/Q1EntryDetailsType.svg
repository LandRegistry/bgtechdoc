<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- Q1EntryDetails -->
    <rect x="30" y="50" width="300" height="150" class="small-box"></rect>
    <text x="40" y="70" class="title">Q1EntryDetails</text>
    <text x="40" y="90" class="content">- EntryNumber</text>
    <text x="170" y="90" class="content">[1..1] TextType</text>
    <text x="40" y="110" class="content">- EntryText</text>
    <text x="170" y="110" class="content">[1..1] TextType</text>
    <text x="40" y="130" class="content">- RegistrationDate</text>
    <text x="170" y="130" class="content">[0..1] DateType</text>
    <text x="40" y="150" class="content">- SubRegisterDate</text>
    <text x="170" y="150" class="content">[0..1] SubRegisterCodeType</text>
    <text x="40" y="170" class="content">- ScheduleCode</text>
    <text x="170" y="170" class="content">[0..1] boolean</text>
    <text x="40" y="190" class="content">- Infills</text>
    <text x="170" y="190" class="content">[0..1] date</text>

    <!-- TextType -->
    <rect x="440" y="5" width="70" height="30" class="small-box"></rect>
