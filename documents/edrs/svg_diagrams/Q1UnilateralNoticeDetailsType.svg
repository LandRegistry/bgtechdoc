<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- Q1UnilateralNoticeEntriesType -->
    <rect x="30" y="50" width="330" height="50" class="small-box"></rect>
    <text x="40" y="70" class="title">Q1UnilateralNoticeEntriesType</text>
    <text x="40" y="90" class="content">- UnilateralNoticeEntry <tspan dx="20">[1..*] Q1UnilateralNoticeDetailsType</tspan></text>

    <!-- Q1UnilateralNoticeDetailsType -->
    <rect x="420" y="5" width="310" height="70" class="small-box"></rect>
    <text x="430" y="25" class="title">Q1UnilateralNoticeDetailsType</text>
    <text x="425" y="45" class="content">- UnilateralNotice</text>
    <text x="595" y="45" class="content">[1..1] Q1EntryDetailsType</text>
    <text x="425" y="65" class="content">- UnilateralNoticeBeneficiary</text>
    <text x="595" y="65" class="content">[1..1] Q1EntryDetailsType</text>

    <!-- Table Lines -->
    <!-- Table Lines - Q1UnilateralNoticeEntriesType -->
    <line x1="30" y1="74" x2="360" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="360" y2="76" stroke="lightgrey"></line>

    <!-- Table Lines - Q1UnilateralNoticeDetailsType -->
    <line x1="420" y1="29" x2="730" y2="29" stroke="lightgrey"></line>
    <line x1="420" y1="31" x2="730" y2="31" stroke="lightgrey"></line>
    <line x1="420" y1="50" x2="730" y2="50" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="360" y1="90" x2="420" y2="20" class="line"></line>

</svg>