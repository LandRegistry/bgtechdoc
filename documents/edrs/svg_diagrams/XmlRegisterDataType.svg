<svg width="700" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- XmlRegisterDataType -->
    <rect x="30" y="50" width="250" height="110" class="small-box"></rect>
    <text x="40" y="70" class="title">XmlRegisterDataType</text>
    <text x="40" y="90" class="content">- TitleNumber</text>
    <text x="180" y="90" class="content">[1..1] string</text>
    <text x="40" y="110" class="content">- PropertyRegister</text>
    <text x="180" y="110" class="content">[1..1] RegisterType</text>
    <text x="40" y="130" class="content">- ProprietorshipRegister</text>
    <text x="180" y="130" class="content">[1..1] RegisterType</text>
    <text x="40" y="150" class="content">- ChargesRegister</text>
    <text x="180" y="150" class="content">[0..1] RegisterType</text>

    <!-- RegisterType -->
    <rect x="380" y="5" width="260" height="90" class="small-box"></rect>
    <text x="390" y="25" class="title">RegisterType</text>
    <text x="385" y="45" class="content">- DistrictDetails</text>
    <text x="510" y="45" class="content">[0..1] DistrictDetailsType</text>
    <text x="385" y="65" class="content">- RegisterEntry</text>
    <text x="510" y="65" class="content">[1..*] RegisterEntryType</text>
    <text x="385" y="85" class="content">- Schedule</text>
    <text x="510" y="85" class="content">[0..*] ScheduleType</text>

    <!-- Table Lines -->
    <!-- Table Lines - XmlRegisterDataType -->
    <line x1="30" y1="74" x2="280" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="280" y2="76" stroke="lightgrey"></line>
    <line x1="30" y1="96" x2="280" y2="96" stroke="lightgrey"></line>
    <line x1="30" y1="116" x2="280" y2="116" stroke="lightgrey"></line>
    <line x1="30" y1="136" x2="280" y2="136" stroke="lightgrey"></line>

    <!-- Table Lines - RegisterType -->
    <line x1="380" y1="29" x2="640" y2="29" stroke="lightgrey"></line>
    <line x1="380" y1="31" x2="640" y2="31" stroke="lightgrey"></line>
    <line x1="380" y1="51" x2="640" y2="51" stroke="lightgrey"></line>
    <line x1="380" y1="71" x2="640" y2="71" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="280" y1="107" x2="380" y2="20" class="line"></line>
    <line x1="280" y1="127" x2="380" y2="20" class="line"></line>
    <line x1="280" y1="147" x2="380" y2="20" class="line"></line>

</svg>