<svg width="1100" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- CorrespondenceV1_0Type -->
    <rect x="30" y="50" width="300" height="50" class="small-box"></rect>
    <text x="40" y="70" class="title">CorrespondenceV1_0Type</text>
    <text x="40" y="90" class="content">- GatewayResponse <tspan dx="35">[1..1] GatewayResponseType</tspan></text>

    <!-- GatewayResponseType -->
    <rect x="380" y="5" width="430" height="130" class="small-box"></rect>
    <text x="390" y="25" class="title">GatewayResponseType</text>
    <text x="390" y="45" class="content">- TypeCode</text>
    <text x="600" y="45" class="content">[1..1] ProductResponseCodeContentType</text>
    <text x="390" y="65" class="content">- ApplicationMessageId</text>
    <text x="600" y="65" class="content">[1..1] string</text>
    <text x="390" y="85" class="content">- ExternalReference</text>
    <text x="600" y="85" class="content">[1..1] string</text>
    <text x="390" y="105" class="content">- ABR (Application Barcode Reference)</text>
    <text x="600" y="105" class="content">[0..1] string</text>
    <text x="390" y="125" class="content">- Correspondence</text>
    <text x="600" y="125" class="content">[1..1] AttachmentType</text>

    <!-- ProductResponseCodeContentType -->
    <rect x="850" y="15" width="220" height="30" class="small-box"></rect>
    <text x="860" y="35" class="title">ProductResponseCodeContentType</text>

    <!-- AttachmentType -->
    <rect x="850" y="75" width="130" height="70" class="small-box"></rect>
    <text x="860" y="95" class="title">AttachmentType</text>
    <text x="855" y="115" class="content">- filename</text>
    <text x="940" y="115" class="content">string</text>
    <text x="855" y="135" class="content">- format</text>
    <text x="940" y="135" class="content">string</text>

    <!-- Table Lines -->
    <!-- Table Lines - CorrespondenceV1_0Type -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>

    <!-- Table Lines - GatewayResponseType -->
    <line x1="380" y1="29" x2="810" y2="29" stroke="lightgrey"></line>
    <line x1="380" y1="31" x2="810" y2="31" stroke="lightgrey"></line>
    <line x1="380" y1="50" x2="810" y2="50" stroke="lightgrey"></line>
    <line x1="380" y1="70" x2="810" y2="70" stroke="lightgrey"></line>
    <line x1="380" y1="90" x2="810" y2="90" stroke="lightgrey"></line>
    <line x1="380" y1="110" x2="810" y2="110" stroke="lightgrey"></line>


    <!-- Table Lines - GatewayResponseType -->
    <line x1="850" y1="99" x2="980" y2="99" stroke="lightgrey"></line>
    <line x1="850" y1="101" x2="980" y2="101" stroke="lightgrey"></line>
    <line x1="850" y1="121" x2="980" y2="121" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="90" x2="380" y2="20" class="line"></line>
    <line x1="810" y1="42" x2="850" y2="30" class="line"></line>
    <line x1="810" y1="122" x2="850" y2="90" class="line"></line>

</svg>