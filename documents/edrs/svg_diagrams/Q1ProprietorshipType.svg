<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #F9F9F9;
            stroke: #707070;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        .line {
            stroke: #707070;
            stroke-width: 1;
        }
        .text {
            font-family: Arial, sans-serif;
            font-size: 12px;
            fill: #000;
        }
        .title {
            font-weight: bold;
            font-size: 12px;
        }
        .content {
            font-size: 11px;
            fill: #333;
        }
        .small-box {
            fill: #FFFFFF;
            stroke: #707070;
            stroke-width: 1;
            rx: 2;
            ry: 2;
        }
    </style>

    <!-- Q1ProprietorshipType -->
    <rect x="30" y="50" width="300" height="90" class="small-box"></rect>
    <text x="40" y="70" class="title">Q1ProprietorshipType</text>
    <text x="40" y="90" class="content">- CurrentProprietorshipDate</text>
    <text x="220" y="90" class="content">[0..1] DateType</text>
    <text x="40" y="110" class="content">- CautionerParty</text>
    <text x="220" y="110" class="content">[1..*] Q1PartyType</text>
    <text x="40" y="130" class="content">- RegisteredProprietorParty</text>
    <text x="220" y="130" class="content">[1..*] Q1PartyType</text>

    <!-- DateType -->
    <rect x="380" y="5" width="70" height="30" class="small-box"></rect>
    <text x="390" y="25" class="title">DateType</text>

    <!-- ChargeApplicationType -->
    <rect x="380" y="80" width="270" height="170" class="small-box"></rect>
    <text x="390" y="100" class="title">Q1PartyType</text>
    <text x="385" y="120" class="content">- PrivateIndividual</text>
    <text x="490" y="120" class="content">[1..1] Q1PrivateIndividualType</text>
    <text x="385" y="140" class="content">- Organization</text>
    <text x="490" y="140" class="content">[1..1] Q1OrganizationType</text>
    <text x="385" y="160" class="content">- Address</text>
    <text x="490" y="160" class="content">[0..*] Q1AddressType</text>
    <text x="385" y="180" class="content">- CharityDetails</text>
    <text x="490" y="180" class="content">[0..1] Q1CharityDetailsType</text>
    <text x="385" y="200" class="content">- TradingName</text>
    <text x="490" y="200" class="content">[0..1] TextType</text>
    <text x="385" y="220" class="content">- PartyNumber</text>
    <text x="490" y="220" class="content">[0..1] TextType</text>
    <text x="385" y="240" class="content">- PartyDescription</text>
    <text x="490" y="240" class="content">[0..1] TextType</text>

    <!-- Table Lines -->
    <!-- Table Lines - Q1ProprietorshipType -->
    <line x1="30" y1="74" x2="330" y2="74" stroke="lightgrey"></line>
    <line x1="30" y1="76" x2="330" y2="76" stroke="lightgrey"></line>
    <line x1="30" y1="96" x2="330" y2="96" stroke="lightgrey"></line>
    <line x1="30" y1="116" x2="330" y2="116" stroke="lightgrey"></line>

    <!-- Table Lines - Q1PartyType -->
    <line x1="380" y1="108" x2="650" y2="108" stroke="lightgrey"></line>
    <line x1="380" y1="106" x2="650" y2="106" stroke="lightgrey"></line>
    <line x1="380" y1="126" x2="650" y2="126" stroke="lightgrey"></line>
    <line x1="380" y1="146" x2="650" y2="146" stroke="lightgrey"></line>
    <line x1="380" y1="166" x2="650" y2="166" stroke="lightgrey"></line>
    <line x1="380" y1="186" x2="650" y2="186" stroke="lightgrey"></line>
    <line x1="380" y1="206" x2="650" y2="206" stroke="lightgrey"></line>
    <line x1="380" y1="226" x2="650" y2="226" stroke="lightgrey"></line>

    <!-- Connecting Lines -->
    <line x1="330" y1="90" x2="380" y2="20" class="line"></line>
    <line x1="330" y1="107" x2="380" y2="95" class="line"></line>
    <line x1="330" y1="127" x2="380" y2="95" class="line"></line>

</svg>